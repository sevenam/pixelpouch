[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/pixelpouch-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/sevenam/pixelpouch"

[workspace.dependencies]
pixelpouch-core = { path = "crates/pixelpouch-core" }
pixelpouch-capture = { path = "crates/pixelpouch-capture" }
pixelpouch-library = { path = "crates/pixelpouch-library" }
pixelpouch-editor = { path = "crates/pixelpouch-editor" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "accesskit",
    "wayland",
    "x11",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
